[workspace]
resolver = "2"
members = [
    "crates/wee-events-macros",
    "crates/wee-events",
    "crates/wee-events-sqlite",
    "crates/wee-events-restate",
]
exclude = ["examples/coroutine-door"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.95" # 2026-04-14
readme = "README.md"

[workspace.dependencies]
ciborium = "0.2"
dashmap = "6"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
