[package]
name = "wee-events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
# TODO: set public repository/homepage/documentation URLs before publishing.

[features]
testing = ["dep:criterion", "dep:tokio", "dep:futures"]
# Internal feature: emits the macro-generated `portable()` helper on each
# service. Default-off so consumer crates whose handlers return richer
# errors than `wee_events::Error` (and hence can't satisfy the helper's
# bridge constraints) compile cleanly without extra ceremony. Enabled by
# the wee-events test build.
__wee_events_portable = []

[dependencies]
ciborium = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"], optional = true }
futures = { version = "0.3", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
ulid = { version = "1", features = ["serde"] }
wee-events-macros = { path = "../wee-events-macros" }

[dev-dependencies]
restate-sdk = "0.9"
wee-events = { path = ".", features = ["testing", "__wee_events_portable"] }
wee-events-restate = { path = "../wee-events-restate" }
tokio = { workspace = true }
trybuild = "1"

[[bench]]
name = "memory_store"
harness = false
