[package]
name = "wee-events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
# TODO: set public repository/homepage/documentation URLs before publishing.

# Suppress the implicit libtest bench harness on the lib target. The only
# bench in this crate is the criterion one declared in `[[bench]]` below;
# without this flag `cargo bench` also tries to run the lib's auto-generated
# libtest harness, which doesn't recognise criterion flags like
# `--save-baseline` and dies with "Unrecognised option".
[lib]
bench = false

[features]
testing = ["dep:criterion", "dep:tokio", "dep:futures"]

[dependencies]
ciborium = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"], optional = true }
futures = { version = "0.3", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
ulid = { version = "1", features = ["serde"] }
wee-events-macros = { path = "../wee-events-macros" }

[dev-dependencies]
restate-sdk = "0.9"
wee-events = { path = ".", features = ["testing"] }
wee-events-restate = { path = "../wee-events-restate" }
tokio = { workspace = true }
trybuild = "1"

[[bench]]
name = "memory_store"
harness = false
