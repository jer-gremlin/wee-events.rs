[package]
name = "wee-events-restate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints.rust]
# Macro-emitted `#[cfg(feature = "__wee_events_portable")]` references a
# feature only defined on the wee-events crate; allow the cfg here.
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(feature, values(\"__wee_events_portable\"))"] }

[dependencies]
bytes = "1"
nanoid = "0.4"
reqwest = { version = "0.12", features = ["json"] }
restate-sdk = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ulid = "1"
wee-events = { path = "../wee-events" }
wee-events-macros = { path = "../wee-events-macros" }

[dev-dependencies]
trybuild = "1"
